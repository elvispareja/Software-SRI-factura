<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de facturación electrónica para Ecuador (SRI)" />
    <title>Cloud Factur AI · Facturación Electrónica SRI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      // Aplica el tema guardado antes del primer pintado para evitar el
      // parpadeo de claro a oscuro. Debe usar la misma clave que TemaProvider.
      (function () {
        try {
          var preferencia = localStorage.getItem('factoa-tema');
          if (preferencia === 'claro' || preferencia === 'oscuro') {
            document.documentElement.setAttribute('data-tema', preferencia);
          }
        } catch (error) {
          /* storage bloqueado: se sigue la preferencia del sistema */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
